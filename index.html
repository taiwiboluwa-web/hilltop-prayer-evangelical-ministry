  <body>
    <div id="root"></div>
    <noscript>
      <main>
        <h1>Hilltop Prayer & Evangelical Ministry</h1>
        <h2>Christian Church in Ipaja, Lagos State, Nigeria</h2>
        <p>Hilltop Prayer & Evangelical Ministry is a Christian church in Ipaja, Lagos State, Nigeria, committed to prayer, evangelism, worship and the teaching of God's Word.</p>
        <p>Visit us at 3 Kola Ojedeji Street, Ipaja, Lagos State, Nigeria. We welcome people from Ipaja, Iyana Ipaja, Egbeda, Abule Egba, Alimosho and surrounding communities.</p>
        <p>Phone / WhatsApp: +234 813 434 6180</p>
        <p>Email: Hilltopprayerministry@gmail.com</p>
        <h2>Our Mission</h2>
        <p>To inculcate a lifestyle of dominion into Christian individuals through consistent intensive study of God's word (the Bible) and faith based prayer lifestyle.</p>
        <h2>Our Vision</h2>
        <p>To raise restored Christians who will exercise divine dominion on earth, walking in the original purpose, image, and plan of God.</p>
        <h2>Our Slogan</h2>
        <p>... a city set on a hill cannot be hidden.</p>
        <h2>Prayer, Worship, Evangelism and Discipleship</h2>
        <p>Find sermons, ministry events, prayer gatherings, Christian fellowship and community outreach from Hilltop Prayer & Evangelical Ministry.</p>
      </main>
    </noscript>
    <script>
      (() => {
        const mission = "To inculcate a lifestyle of dominion into Christian individuals through consistent intensive study of God's word (the Bible) and faith based prayer lifestyle.";
        const vision = "To raise restored Christians who will exercise divine dominion on earth, walking in the original purpose, image, and plan of God.";
        const slogan = "... a city set on a hill cannot be hidden.";
        const email = "Hilltopprayerministry@gmail.com";
        const phone = "+234 813 434 6180";
        const phoneHref = "tel:+2348134346180";
        const whatsappHref = "https://wa.me/2348134346180";

        const updateAboutContent = () => {
          const headings = Array.from(document.querySelectorAll('h3'));
          const findCard = (label) => {
            const heading = headings.find((el) => el.textContent.trim() === label);
            return heading ? heading.closest('.glass-hi') : null;
          };

          const missionCard = findCard('Our Mission');
          const visionCard = findCard('Our Vision');

          if (missionCard) {
            const p = missionCard.querySelector('p');
            if (p && p.textContent.trim() !== mission) p.textContent = mission;
          }

          if (visionCard) {
            const p = visionCard.querySelector('p');
            if (p && p.textContent.trim() !== vision) p.textContent = vision;
          }

          const grid = missionCard && missionCard.parentElement;
          if (grid && visionCard && !grid.querySelector('[data-hilltop-slogan]')) {
            const card = document.createElement('div');
            card.setAttribute('data-hilltop-slogan', 'true');
            card.className = 'glass-hi';
            card.style.cssText = 'border-radius:20px;padding:40px 36px;border:1px solid rgba(201,168,76,0.25);position:relative;overflow:hidden;';
            card.innerHTML = `
              <div style="width:48px;height:48px;border-radius:50%;background:rgba(201,168,76,0.12);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:20px;color:var(--gold-light);font-size:1.2rem;font-weight:800">⛰️</div>
              <h3 class="serif" style="font-family:'Instrument Serif';font-size:2rem;color:var(--ivory);margin-bottom:12px">Our Slogan</h3>
              <p style="font-family:'Outfit';font-size:0.92rem;color:var(--muted);line-height:1.75">${slogan}</p>
            `;
            grid.appendChild(card);
          }

          document.querySelectorAll('a[href^="mailto:"]').forEach((a) => {
            if (a.getAttribute('href') !== `mailto:${email}`) a.setAttribute('href', `mailto:${email}`);
            if ((!a.textContent.trim() || /email/i.test(a.textContent)) && a.textContent.trim() !== email) a.textContent = email;
          });

          document.querySelectorAll('a[href*="wa.me"], a[href*="whatsapp"]').forEach((a) => {
            if (a.getAttribute('href') !== whatsappHref) a.setAttribute('href', whatsappHref);
            a.setAttribute('target', '_blank');
            a.setAttribute('rel', 'noreferrer');
          });

          document.querySelectorAll('a[href^="tel:"]').forEach((a) => {
            if (a.getAttribute('href') !== phoneHref) a.setAttribute('href', phoneHref);
            if (/08090441087|\+234\s*809\s*044\s*1087|809\s*044\s*1087/.test(a.textContent) && a.textContent.trim() !== phone) a.textContent = phone;
          });

          document.querySelectorAll('a, p, div, span').forEach((el) => {
            if (el.children.length === 0 && /\+?234\s*809\s*044\s*1087|08090441087/.test(el.textContent.trim()) && el.textContent.trim() !== phone) {
              el.textContent = phone;
            }
          });
        };

        let queued = false;
        const scheduleUpdate = () => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(() => {
            queued = false;
            updateAboutContent();
          });
        };

        const root = document.getElementById('root');
        if (root) {
          const observer = new MutationObserver(scheduleUpdate);
          // Do NOT observe characterData: this script changes text nodes itself,
          // which previously created a mutation feedback loop and could blank the page.
          observer.observe(root, { childList: true, subtree: true });
          updateAboutContent();
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
